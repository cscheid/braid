[package]
name = "braid"
description = "braid: a local-first issue tracker for LLM agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "braid"
path = "src/main.rs"

[dependencies]
braid-core = { path = "../braid-core" }
braid-config = { workspace = true }
automerge = { workspace = true }
# No "tungstenite" feature: it hardcodes native-tls → OpenSSL on Linux,
# breaking static musl release builds. src/ws.rs provides the websocket
# dialer instead, over rustls (br-f3b18xoa).
samod = { workspace = true, features = ["tokio"] }
tokio = { workspace = true, features = ["signal"] }
futures = { workspace = true }
# "connect" + rustls for the dialer (src/ws.rs); "handshake" also covers
# the accept side of the tests' in-process ws server. "rustls-tls-webpki-roots"
# is the feature that turns on tungstenite's rustls Connector plumbing; its
# bundled default root store is unused because src/ws.rs passes its own
# Connector built from webpki roots *plus* the platform/proxy CA store.
tokio-tungstenite = { workspace = true, features = [
    "connect",
    "handshake",
    "rustls-tls-webpki-roots",
] }
# tungstenite leaves rustls's crypto-provider choice to us; ring (rather
# than the default aws-lc-rs) cross-compiles cleanly to musl and builds
# everywhere without cmake.
rustls = { workspace = true }
# Compiled-in Mozilla roots: a static binary trusts public servers even in
# a container with no system trust store.
webpki-roots = { workspace = true }
# Platform trust anchors, honoring SSL_CERT_FILE / SSL_CERT_DIR — how a
# sandbox or corporate MITM-proxy CA bundle reaches braid.
rustls-native-certs = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = "0.10"
toml = "0.8"
rmcp = { version = "1.7.0", default-features = false, features = ["server", "transport-io"] }
axum = { workspace = true }
rust-embed = { workspace = true, features = ["mime-guess"] }

[dev-dependencies]
chrono = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util"] }
tempfile = "3"
assert_cmd = "2"
predicates = "3"
jsonschema = { version = "0.46", default-features = false }
